<main>
  <h1>Dialogs</h1>
  <section>
    <button type="button" id="alert">Show alert</button>
    <button type="button" id="confirm">Show confirm</button>
    <button type="button" id="prompt">Show prompt</button>
    <p id="dialog-out"></p>
  </section>
</main>
<script>
  const out = document.getElementById("dialog-out");
  document.getElementById("alert").onclick = () => { alert("Hello from an alert!"); out.textContent = "Alert closed"; };
  document.getElementById("confirm").onclick = () => { out.textContent = confirm("Are you sure?") ? "You pressed OK" : "You pressed Cancel"; };
  document.getElementById("prompt").onclick = () => {
    const name = prompt("What is your name?", "");
    out.textContent = name ? "Hello, " + name : "No name given";
  };
</script>
