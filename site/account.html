<main>
  <h1 id="who">Checking your session…</h1>
  <button type="button" id="logout" class="hidden">Log out</button>
</main>
<script>
  (async () => {
    const res = await fetch("/api/me");
    if (!res.ok) { location.replace("login.html?next=account"); return; }
    document.getElementById("who").textContent = "Signed in as " + (await res.json()).username;
    document.getElementById("logout").classList.remove("hidden");
  })();
  document.getElementById("logout").onclick = async () => {
    await fetch("/api/logout", { method: "POST" });
    location.href = "login.html";
  };
</script>
</body>
