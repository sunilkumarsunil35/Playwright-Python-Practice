<main>
  <h1>Downloads</h1>
  <section>
    <p><a href="/files/report.csv">Download report</a></p>
    <button type="button" id="export">Export notes</button>
  </section>
</main>
<script>
  document.getElementById("export").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["Notes exported from the practice site\n"], { type: "text/plain" }));
    a.download = "notes.txt";
    document.body.append(a);
    a.click();
    a.remove();
  };
</script>
